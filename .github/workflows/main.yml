name: Crea APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compila l'APK
        run: |
          if [ -d pillole-android ]; then cd pillole-android; fi
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/LeMiePillole.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: LeMiePillole-APK
          path: LeMiePillole.apk
